[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-predictions-bot"
version = "0.1.0"
description = "Windows-native Gemini Predictions liquidity-rewards market maker"
requires-python = ">=3.12"
dependencies = [
  "websockets==15.0.1",
  "tzdata==2025.2",
]

[project.scripts]
gemini-bot = "gemini_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"

